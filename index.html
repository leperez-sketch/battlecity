<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplayer Tank Battle Retro</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pantalla de Lobby -->
    <div id="lobby-screen" class="screen">
        <div class="pixel-panel">
            <h1 class="title">TANK BATTLE<br><span class="highlight">MULTIPLAYER</span></h1>
            
            <div class="form-group">
                <label for="player-name">NICKNAME:</label>
                <input type="text" id="player-name" maxlength="10" placeholder="Ej: COMMANDER" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="room-code">SALA (ROOM):</label>
                <input type="text" id="room-code" maxlength="6" placeholder="TANK01" style="text-transform: uppercase;">
            </div>

            <div class="button-group">
                <button id="btn-start" class="btn btn-primary">UNIRSE / CREAR SALLA</button>
            </div>
            
            <p id="lobby-status" class="status-msg"></p>
        </div>
    </div>

    <!-- Contenedor Principal del Juego -->
    <div id="game-screen" class="screen hidden">
        <div id="hud">
            <div>SALA: <span id="hud-room">---</span></div>
            <div>JUGADORES: <span id="hud-count">1</span></div>
            <div>TU HP: <span id="hud-hp">100%</span></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- Controles Táctiles para Móviles -->
        <div id="mobile-controls">
            <div class="dpad">
                <button id="btn-up" class="touch-btn">▲</button>
                <div class="dpad-middle">
                    <button id="btn-left" class="touch-btn">◀</button>
                    <button id="btn-down" class="touch-btn">▼</button>
                    <button id="btn-right" class="touch-btn">▶</button>
                </div>
            </div>
            <div class="action-btn-container">
                <button id="btn-fire" class="touch-btn fire-btn">FIRE 🔥</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
